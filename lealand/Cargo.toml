[package]
name = "lealand"
version = "0.2.0"
edition = "2024"
description = "lealand: an inline directory browser with typed chords, run as ll"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ll"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crokey = "1.5"
ignore = "0.4"
libc = "0.2"
unicode-width = "0.2.3"
toml_edit = "0.25.21"
pulldown-cmark = { version = "0.13.6", default-features = false }

[profile.release]
opt-level = "z"  # small over fast: it is quick enough either way
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
