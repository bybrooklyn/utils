[package]
name = "lealand"
version = "0.2.0"
edition = "2024"
description = "lealand: an inline directory browser with typed chords, run as ll"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ll"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crokey = "1.5"
ignore = "0.4"
libc = "0.2"
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
